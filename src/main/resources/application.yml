spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/fibonacci_db}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 9000
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.emc.test: DEBUG
    org.hibernate.SQL: DEBUG
